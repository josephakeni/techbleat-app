apiVersion: v1
kind: ConfigMap
metadata:
  name: techbleat-config
  namespace: techbleat
data:
  # Postgres
  POSTGRES_DB: bankingdb
  POSTGRES_USER: bankuser

  # Shared app config
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankingdb
  SPRING_DATASOURCE_USERNAME: bankuser
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # Redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"

  # Transaction service
  SERVER_PORT: "8080"

  # CORS — frontend NodePort URL (any k8s node IP works)
  FRONTEND_ORIGIN: http://192.168.0.40:30300

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: techbleat
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id VARCHAR(50) PRIMARY KEY,
        full_name VARCHAR(100) NOT NULL,
        email VARCHAR(120) UNIQUE NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS accounts (
        user_id VARCHAR(50) PRIMARY KEY,
        balance NUMERIC(12,2) NOT NULL DEFAULT 0,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS transactions (
        id SERIAL PRIMARY KEY,
        user_id VARCHAR(50) NOT NULL,
        transaction_type VARCHAR(30) NOT NULL,
        amount NUMERIC(12,2) NOT NULL,
        reference VARCHAR(100),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS activities (
        id SERIAL PRIMARY KEY,
        user_id VARCHAR(50) NOT NULL,
        activity_type VARCHAR(50) NOT NULL,
        description TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

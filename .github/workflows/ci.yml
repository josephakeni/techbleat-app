name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/techbleat

jobs:
  # ── Tests ─────────────────────────────────────────────────────────────────
  test-transaction-service:
    name: Test transaction-service (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: techbleat-global-bank-backend/transaction-service
        run: mvn test --no-transfer-progress

  test-frontend:
    name: Test frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: techbleat-global-bank-frontend/package-lock.json

      - name: Install dependencies
        working-directory: techbleat-global-bank-frontend
        run: npm ci

      - name: Build (lint + compile check)
        working-directory: techbleat-global-bank-frontend
        run: npm run build

  # ── Build & Push ──────────────────────────────────────────────────────────
  build-backend:
    name: Build ${{ matrix.service }}
    needs: [test-transaction-service, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            context: ./techbleat-global-bank-backend/user-service
          - service: activity-service
            context: ./techbleat-global-bank-backend/activity-service
          - service: transaction-service
            context: ./techbleat-global-bank-backend/transaction-service

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontend:
    name: Build frontend
    needs: [test-transaction-service, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./techbleat-global-bank-frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          # CLUSTER_BASE_URL repo variable: the URL browsers use to reach the ingress.
          # Default: http://192.168.0.41:30080  Update when you get a domain.
          build-args: |
            VITE_USER_API=${{ vars.CLUSTER_BASE_URL || 'http://192.168.0.41:30080' }}
            VITE_TX_API=${{ vars.CLUSTER_BASE_URL || 'http://192.168.0.41:30080' }}
            VITE_ACTIVITY_API=${{ vars.CLUSTER_BASE_URL || 'http://192.168.0.41:30080' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Trigger infra deployment ──────────────────────────────────────────────
  trigger-deploy:
    name: Trigger deployment
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy workflow in techbleat-infra
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/josephakeni/techbleat-infra/actions/workflows/deploy.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"image_tag\":\"${{ github.sha }}\"}}"

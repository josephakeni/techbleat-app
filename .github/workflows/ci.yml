name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_USERNAME: jakeni

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────

  test-transaction-service:
    name: Test / transaction-service (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: techbleat-global-bank-backend/transaction-service
        run: mvn test --no-transfer-progress

  test-frontend:
    name: Test / frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: techbleat-global-bank-frontend/package-lock.json

      - name: Install dependencies
        working-directory: techbleat-global-bank-frontend
        run: npm ci

      - name: Build (lint + compile check)
        working-directory: techbleat-global-bank-frontend
        run: npm run build

  # ── Build & Push ───────────────────────────────────────────────────────────

  build-and-push:
    name: Build & Push / ${{ matrix.service }}
    if: github.event_name == 'push'
    needs:
      - test-transaction-service
      - test-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: user-service
            context: techbleat-global-bank-backend/user-service
            image: jakeni/techbleat-user-service

          - service: activity-service
            context: techbleat-global-bank-backend/activity-service
            image: jakeni/techbleat-activity-service

          - service: transaction-service
            context: techbleat-global-bank-backend/transaction-service
            image: jakeni/techbleat-transaction-service

          - service: frontend
            context: techbleat-global-bank-frontend
            image: jakeni/techbleat-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── Open Infra PR ──────────────────────────────────────────────────────────

  open-infra-pr:
    name: Open infra PR
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: josephakeni/techbleat-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Bump image tags in k8s manifests
        run: |
          SHA="${{ github.sha }}"
          cd infra
          sed -i "s|jakeni/techbleat-user-service:[^ ]*|jakeni/techbleat-user-service:${SHA}|g" \
            k8s/apps/user-service.yaml
          sed -i "s|jakeni/techbleat-activity-service:[^ ]*|jakeni/techbleat-activity-service:${SHA}|g" \
            k8s/apps/activity-service.yaml
          sed -i "s|jakeni/techbleat-transaction-service:[^ ]*|jakeni/techbleat-transaction-service:${SHA}|g" \
            k8s/apps/transaction-service.yaml
          sed -i "s|jakeni/techbleat-frontend:[^ ]*|jakeni/techbleat-frontend:${SHA}|g" \
            k8s/apps/frontend.yaml

      - name: Push branch and open PR
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH="update-images-${SHORT_SHA}"

          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add k8s/apps/
          git commit -m "chore: bump image tags to ${SHORT_SHA}"
          git push origin "${BRANCH}"

          gh pr create \
            --title "chore: bump image tags to ${SHORT_SHA}" \
            --body "Automated bump from app commit [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})." \
            --base main \
            --head "${BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}

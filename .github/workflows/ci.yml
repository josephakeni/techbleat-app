name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_USERNAME: jakeni

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────

  test-transaction-service:
    name: Test / transaction-service (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: techbleat-global-bank-backend/transaction-service
        run: mvn test --no-transfer-progress

  test-frontend:
    name: Test / frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: techbleat-global-bank-frontend/package-lock.json

      - name: Install dependencies
        working-directory: techbleat-global-bank-frontend
        run: npm ci

      - name: Build (lint + compile check)
        working-directory: techbleat-global-bank-frontend
        run: npm run build

  # ── Build & Push ───────────────────────────────────────────────────────────

  build-and-push:
    name: Build & Push
    if: github.event_name == 'push'
    needs:
      - test-transaction-service
      - test-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techbleat-global-bank-backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend images
        run: make build TAG=${{ github.sha }}

      # Uses build-frontend-k8s so VITE_* API URLs are baked in with NodePort addresses.
      # Override HOST_IP via a repository variable if your node IP differs from the Makefile default.
      - name: Build frontend image
        run: make build-frontend-k8s TAG=${{ github.sha }} HOST_IP=${{ vars.HOST_IP || '192.168.0.10' }}

      - name: Push backend images
        run: make push TAG=${{ github.sha }}

      - name: Push frontend image
        run: docker push jakeni/techbleat-frontend:${{ github.sha }}

      - name: Retag and push as latest
        run: |
          for img in \
            jakeni/techbleat-user-service \
            jakeni/techbleat-transaction-service \
            jakeni/techbleat-activity-service \
            jakeni/techbleat-frontend; do
            docker tag "${img}:${{ github.sha }}" "${img}:latest"
            docker push "${img}:latest"
          done

  # ── Open Infra PR ──────────────────────────────────────────────────────────

  open-infra-pr:
    name: Open infra PR
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: josephakeni/techbleat-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Bump image tags in k8s manifests
        run: |
          SHA="${{ github.sha }}"
          cd infra
          sed -i "s|jakeni/techbleat-user-service:[^ ]*|jakeni/techbleat-user-service:${SHA}|g" \
            k8s/apps/user-service.yaml
          sed -i "s|jakeni/techbleat-activity-service:[^ ]*|jakeni/techbleat-activity-service:${SHA}|g" \
            k8s/apps/activity-service.yaml
          sed -i "s|jakeni/techbleat-transaction-service:[^ ]*|jakeni/techbleat-transaction-service:${SHA}|g" \
            k8s/apps/transaction-service.yaml
          sed -i "s|jakeni/techbleat-frontend:[^ ]*|jakeni/techbleat-frontend:${SHA}|g" \
            k8s/apps/frontend.yaml

      - name: Push branch and open PR
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH="update-images-${SHORT_SHA}"

          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add k8s/apps/
          git commit -m "chore: bump image tags to ${SHORT_SHA}"
          git push origin "${BRANCH}"

          gh pr create \
            --title "chore: bump image tags to ${SHORT_SHA}" \
            --body "Automated bump from app commit [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})." \
            --base main \
            --head "${BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
